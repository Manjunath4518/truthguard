services:
  - type: web
    name: truthguard-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/documents
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
